<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Data Scraper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }

    .container {
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      color: white;
    }

    .header h1 {
      font-size: 22px;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .header p {
      font-size: 13px;
      opacity: 0.9;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 15px;
    }

    .status {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 13px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .status.success {
      display: block;
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status.loading {
      display: block;
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #5a6268;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .preview {
      max-height: 250px;
      overflow-y: auto;
      font-size: 12px;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .preview::-webkit-scrollbar {
      width: 6px;
    }

    .preview::-webkit-scrollbar-track {
      background: #e9ecef;
      border-radius: 3px;
    }

    .preview::-webkit-scrollbar-thumb {
      background: #adb5bd;
      border-radius: 3px;
    }

    .preview-item {
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #dee2e6;
    }

    .preview-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .preview-label {
      font-weight: 600;
      color: #495057;
      margin-bottom: 3px;
    }

    .preview-value {
      color: #6c757d;
      word-break: break-word;
    }

    .preview-image {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      margin-top: 5px;
    }

    .config-warning {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 15px;
    }

    .config-warning strong {
      display: block;
      margin-bottom: 5px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #0c5460;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛍️ Product Scraper</h1>
      <p>Extract product data to your dashboard</p>
    </div>

    <div id="authSection" class="card" style="display: none;">
      <h3 style="margin-bottom: 15px; font-size: 16px; color: #495057;">Sign In Required</h3>
      <p style="margin-bottom: 15px; font-size: 13px; color: #6c757d;">
        Please sign in to save products to your dashboard.
      </p>
      <button id="openDashboardBtn" class="btn btn-primary">
        Open Dashboard to Sign In
      </button>
    </div>

    <div id="userSection" class="card" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <div>
          <div style="font-size: 12px; color: #6c757d;">Signed in as</div>
          <div id="userEmail" style="font-size: 14px; font-weight: 600; color: #495057;"></div>
        </div>
        <button id="signOutBtn" style="padding: 6px 12px; background: #dc3545; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px;">
          Sign Out
        </button>
      </div>
    </div>

    <div id="configWarning" class="config-warning" style="display: none;">
      <strong>⚠️ Configuration Required</strong>
      Please update the Google Apps Script URL in config.js
    </div>

    <div id="status" class="status"></div>

    <div class="card">
      <button id="scrapeBtn" class="btn btn-primary" disabled>
        📦 Scrape Product Data
      </button>

      <button id="previewBtn" class="btn btn-secondary">
        👁️ Preview Data
      </button>

      <button id="viewDashboardBtn" class="btn btn-secondary">
        🔗 View Dashboard
      </button>
    </div>

    <div id="previewContainer" style="display: none;">
      <div class="card">
        <h3 style="margin-bottom: 15px; font-size: 16px; color: #495057;">Product Preview</h3>
        <div id="preview" class="preview"></div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="popup.js"></script>
</body>
</html>
